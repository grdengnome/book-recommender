<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fantasy: one-book reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px; background: #2A1B4A; color: #F1E3C0; font-family: 'Alegreya', serif; overflow: hidden">
<div style="position: relative; height: 100%; box-sizing: border-box; border: 2px solid #F2C230; box-shadow: inset 0 0 0 5px #2A1B4A, inset 0 0 0 7px #F2C230; padding: 20px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg viewBox="0 0 330 800" style="position: absolute; left: 14px; top: 8px; width: 330px; height: 800px" aria-hidden="true">
<path d="M30 60 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#F2C230"/>
<path d="M300 110 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#F1E3C0"/>
<path d="M26 420 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#F1E3C0"/>
<path d="M306 470 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#F2C230"/>
</svg>
<div style="position: relative; font-family: 'Uncial Antiqua', serif; font-size: 22px; color: #F2C230">The first of three</div>
<div style="position: relative; padding: 9px 9px 0; background: #F2C230; border-radius: 150px 150px 0 0; margin-top: 6px">
<div style="width: 250px; height: 400px; background: #1F7A6C; border-radius: 142px 142px 0 0; display: flex; align-items: flex-end; justify-content: center; padding: 16px; box-sizing: border-box; font-size: 14px; font-weight: 700; letter-spacing: 2px">COVER ART</div>
</div>
<div style="position: relative; align-self: stretch; margin: -1px -6px 0; padding: 12px 30px; background: {{accent}}; clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 50%, 100% 100%, 0 100%, 18px 50%); text-align: center; font-family: 'Uncial Antiqua', serif; font-size: 24px; line-height: 1.1">[Book title]</div>
<div style="position: relative; text-align: center">
<div style="font-size: 17px; font-weight: 700; color: #F2C230">[Author name]</div>
<div style="font-style: italic; font-size: 19px; line-height: 1.25; margin-top: 6px">[One line on why it's for you.]</div>
</div>
<div style="position: relative; align-self: stretch; display: flex; gap: 12px; align-items: center; margin-top: auto">
<button style="flex: 1; padding: 13px 8px; background: transparent; color: #F1E3C0; border: 0; border-top: 1px solid #F2C230; border-bottom: 1px solid #F2C230; font: 400 17px 'Uncial Antiqua', serif">Tell me more</button>
<button style="flex: 1; padding: 14px 24px; background: #F2C230; color: #2A1B4A; border: 0; clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 50%, 100% 100%, 0 100%, 16px 50%); font: 400 17px 'Uncial Antiqua', serif">Next pick</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9B1C2E"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#9B1C2E' };
}
}
</script>
</body>
</html>
