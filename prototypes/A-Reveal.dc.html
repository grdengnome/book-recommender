<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Café bookshop: reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; background: #2A1A12; color: #F3EAD8; font-family: 'Courier Prime', monospace; display: flex; flex-direction: column; overflow: hidden; position: relative">
<svg viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px" aria-hidden="true">
<defs>
<pattern id="cr-brick" width="56" height="36" patternUnits="userSpaceOnUse">
<rect width="56" height="36" fill="#2A1A12"/>
<rect x="1" y="1" width="54" height="16" fill="#5A2A1C"/>
<rect x="-27" y="19" width="54" height="16" fill="#6B3222"/>
<rect x="29" y="19" width="54" height="16" fill="#52261A"/>
</pattern>
<radialGradient id="cr-glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="{{accent}}" stop-opacity="0.85"/>
<stop offset="0.6" stop-color="{{accent}}" stop-opacity="0.25"/>
<stop offset="1" stop-color="{{accent}}" stop-opacity="0"/>
</radialGradient>
<linearGradient id="cr-fade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#171311" stop-opacity="0.75"/>
<stop offset="0.35" stop-color="#171311" stop-opacity="0"/>
<stop offset="0.62" stop-color="#171311" stop-opacity="0.2"/>
<stop offset="1" stop-color="#171311" stop-opacity="0.9"/>
</linearGradient>
</defs>
<rect width="390" height="844" fill="url(#cr-brick)"/>
<ellipse cx="195" cy="440" rx="270" ry="330" fill="url(#cr-glow)"/>
<rect width="390" height="844" fill="url(#cr-fade)"/>
<g stroke="#4F7F45" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M30 459 Q14 420 4 410"/><path d="M30 459 Q26 414 20 396"/><path d="M30 459 Q38 418 46 404"/><path d="M30 459 Q52 436 58 432"/>
</g>
<path d="M16 440 h28 l-4 19 h-20z" fill="#A6492E"/>
<path d="M364 436 Q356 418 366 410 T372 394" stroke="#6FA35A" stroke-width="8" fill="none" stroke-linecap="round"/>
<circle cx="373" cy="394" r="1.8" fill="#171311"/>
<rect x="346" y="432" width="30" height="27" rx="3" fill="#FBF6EA" stroke="#171311" stroke-width="2"/>
<path d="M346 440 q-11 2 0 14" stroke="#FBF6EA" stroke-width="3" fill="none"/>
<rect x="0" y="459" width="390" height="13" fill="#4A2C1A"/>
<rect x="0" y="470" width="390" height="4" fill="#171311"/>
<path d="M44 474 v28 M44 502 q0 -26 28 -28 M346 474 v28 M346 502 q0 -26 -28 -28" stroke="#171311" stroke-width="4" fill="none"/>
</svg>
<div style="display: flex; justify-content: space-between; align-items: center; position: relative; height: 30px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 3px; line-height: 1">WORM</div>
<div style="background: #4A2C1A; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 4px 10px 2px; border: 1px solid #F3EAD8">Pick 1 of 3</div>
</div>
<div style="position: relative; width: 262px; height: 393px; margin: 16px auto 0; box-sizing: border-box; background: #3E7C7A; border: 3px solid #171311; box-shadow: 0 0 40px rgba(242,162,58,0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #F3EAD8">
<div style="width: 120px; height: 120px; border-radius: 50%; background: {{accent}}"></div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 4px">COVER ART</div>
</div>
<div style="position: relative; margin-top: 60px; background: #FBF6EA; color: #171311; border: 2px solid #171311; box-shadow: inset 0 0 0 4px #FBF6EA, inset 0 0 0 5px #171311; padding: 14px 18px 12px">
<div style="font-size: 13px; font-weight: 700; color: #4A2C1A">Today's pour</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px">[Book title]</div>
<div style="font-size: 15px; margin-top: 2px">[Author name]</div>
<div style="font-size: 15px; line-height: 1.3; margin-top: 8px">[One line on why this book is for you.]</div>
</div>
<div style="position: relative; display: flex; gap: 12px; margin-top: auto">
<button style="flex: 1; padding: 14px 8px; background: #2A1A12; color: #F3EAD8; border: 2px solid #F3EAD8; font: 800 21px 'Barlow Condensed', sans-serif; letter-spacing: 2px; text-transform: uppercase">Read the tag</button>
<button style="flex: 1; position: relative; padding: 14px 8px 14px 26px; background: {{accent}}; color: #171311; border: 0; clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 50%); font: 800 21px 'Barlow Condensed', sans-serif; letter-spacing: 2px; text-transform: uppercase">
<div style="position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: #2A1A12"></div>
Next pick
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A23A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F2A23A' };
}
}
</script>
</body>
</html>
