# Dependabot keeps the app's libraries and GitHub Actions up to date (decision 11.11).
# Security fixes arrive as soon as they're published (when Dependabot security updates are on in
# the repo settings). Routine updates come weekly or monthly, grouped so they arrive as a few PRs
# rather than many. Each update PR goes through the normal checks and review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
