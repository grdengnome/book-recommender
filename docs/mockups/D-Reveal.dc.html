<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mystery: one-book reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 24px 28px; background: #0B0D12; color: #D9D4C7; font-family: 'Special Elite', monospace; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow: hidden; position: relative">
<svg viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px" aria-hidden="true">
<defs><pattern id="rainr" width="26" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(16)"><path d="M6 0 v26 M19 30 v22" stroke="#8D95A6" stroke-width="1.2" opacity="0.5"/></pattern></defs>
<path d="M195 -10 L-40 560 H430z" fill="{{accent}}" opacity="0.14"/>
<path d="M195 -10 L60 560 H330z" fill="{{accent}}" opacity="0.16"/>
<g fill="#000000" opacity="0.45">
<rect x="0" y="80" width="390" height="16" transform="skewY(-6)"/>
<rect x="0" y="150" width="390" height="16" transform="skewY(-6)"/>
<rect x="0" y="220" width="390" height="16" transform="skewY(-6)"/>
<rect x="0" y="290" width="390" height="16" transform="skewY(-6)"/>
<rect x="0" y="360" width="390" height="16" transform="skewY(-6)"/>
<rect x="0" y="430" width="390" height="16" transform="skewY(-6)"/>
<rect x="0" y="500" width="390" height="16" transform="skewY(-6)"/>
</g>
<path d="M70 566 h80 M180 574 h120 M250 562 h70" stroke="{{accent}}" stroke-width="2" opacity="0.5"/>
<rect width="390" height="844" fill="url(#rainr)"/>
</svg>
<div style="position: relative; align-self: stretch; display: flex; justify-content: space-between; align-items: baseline">
<div style="font-family: 'Limelight', serif; font-size: 22px; letter-spacing: 2px">The first lead</div>
<div style="font-size: 14px; color: {{accent}}">1 of 3</div>
</div>
<div style="position: relative; width: 264px; height: 396px; background: #2A2F3B; border: 1px solid #D9D4C7; box-shadow: 0 0 0 6px #0B0D12, 0 0 0 7px {{accent}}; margin-top: 26px; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box; font-size: 14px; letter-spacing: 2px">COVER ART</div>
<div style="position: relative; align-self: stretch; text-align: center; margin-top: 24px">
<div style="font-family: 'Limelight', serif; font-size: 30px; line-height: 1.1">[Book title]</div>
<div style="font-size: 15px; color: {{accent}}; margin-top: 6px">[Author name]</div>
<div style="font-size: 17px; line-height: 1.35; margin-top: 10px">[One line on why it's for you.]</div>
</div>
<div style="position: relative; align-self: stretch; display: flex; gap: 14px; margin-top: auto">
<button style="flex: 1; padding: 13px 6px; background: transparent; color: #D9D4C7; border: 0; border-bottom: 1px solid #D9D4C7; font: 400 17px 'Limelight', serif; letter-spacing: 2px">The full story</button>
<button style="flex: 1; padding: 13px 6px; background: transparent; color: {{accent}}; border: 1px solid {{accent}}; box-shadow: inset 0 0 0 4px #0B0D12, inset 0 0 0 5px {{accent}}; font: 400 17px 'Limelight', serif; letter-spacing: 2px">Next lead</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8B04A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E8B04A' };
}
}
</script>
</body>
</html>
