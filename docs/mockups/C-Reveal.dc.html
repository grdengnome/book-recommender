<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panels: one-book reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px 22px; background-color: #19B5E6; background-image: radial-gradient(rgba(17,17,17,0.18) 1.6px, transparent 1.8px); background-size: 9px 9px; color: #111111; font-family: 'Comic Neue', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow: hidden; position: relative">
<div style="position: absolute; width: 560px; height: 560px; left: -85px; top: 30px; background: {{accent}}; clip-path: polygon(50% 0%,59% 14%,75% 7%,76% 24%,93% 25%,86% 41%,100% 50%,86% 59%,93% 75%,76% 76%,75% 93%,59% 86%,50% 100%,41% 86%,25% 93%,24% 76%,7% 75%,14% 59%,0% 50%,14% 41%,7% 25%,24% 24%,25% 7%,41% 14%)"></div>
<div style="position: relative; align-self: flex-start; font-family: 'Bangers', cursive; font-size: 44px; letter-spacing: 3px; transform: rotate(-4deg); text-shadow: 3px 3px 0 #FFFFFF">HERO #1!</div>
<div style="position: relative; width: 262px; height: 393px; background: #E8262B; border: 5px solid #111111; box-shadow: 10px 10px 0 #111111; transform: rotate(2deg); display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box; color: #FFFFFF; font-size: 14px; font-weight: 700; letter-spacing: 2px">COVER ART</div>
<div style="position: relative; align-self: stretch; background: #FFFFFF; border: 4px solid #111111; box-shadow: 6px 6px 0 #111111; padding: 12px 14px; margin-top: -26px">
<div style="font-family: 'Bangers', cursive; font-size: 30px; line-height: 1; letter-spacing: 1px">[Book title]</div>
<div style="font-size: 14px; font-weight: 700; margin-top: 2px">[Author name]</div>
<div style="font-size: 16px; font-weight: 700; line-height: 1.2; margin-top: 6px">[One line on why it's for you.]</div>
</div>
<div style="position: relative; align-self: stretch; display: flex; gap: 12px; margin-top: auto">
<button style="flex: 1; padding: 10px; background: #FFFFFF; color: #111111; border: 4px solid #111111; font: 400 24px 'Bangers', cursive; letter-spacing: 2px">MORE</button>
<button style="flex: 1; padding: 10px; background: #C91D22; color: #FFFFFF; border: 4px solid #111111; box-shadow: 6px 6px 0 #111111; font: 400 24px 'Bangers', cursive; letter-spacing: 2px">NEXT PICK!</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFE14A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FFE14A' };
}
}
</script>
</body>
</html>
