<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sci-fi: one-book reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; background-color: #060B14; background-image: repeating-linear-gradient(transparent, transparent 3px, rgba(54,214,231,0.05) 3px, rgba(54,214,231,0.05) 4px); color: #D8F6FA; font-family: 'Share Tech Mono', monospace; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow: hidden; position: relative">
<svg viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px" aria-hidden="true">
<circle cx="195" cy="290" r="236" fill="{{accent}}"/>
<circle cx="195" cy="290" r="186" fill="none" stroke="#060B14" stroke-width="5"/>
<ellipse cx="195" cy="290" rx="290" ry="58" fill="none" stroke="#36D6E7" stroke-width="7" transform="rotate(-18 195 290)"/>
<circle cx="40" cy="620" r="3" fill="#D8F6FA"/><circle cx="350" cy="640" r="2" fill="#36D6E7"/>
</svg>
<div style="position: relative; align-self: stretch; display: flex; justify-content: space-between; align-items: center">
<div style="font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 3px; color: #060B14; background: #36D6E7; padding: 5px 12px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%)">SIGNAL 1/3</div>
<div style="font-size: 13px; color: #060B14; background: #D8F6FA; padding: 4px 8px">MATCH LOCKED</div>
</div>
<div style="position: relative; padding: 14px; margin-top: 6px">
<div style="position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-left: 4px solid #36D6E7; border-top: 4px solid #36D6E7"></div>
<div style="position: absolute; right: 0; top: 0; width: 36px; height: 36px; border-right: 4px solid #36D6E7; border-top: 4px solid #36D6E7"></div>
<div style="position: absolute; left: 0; bottom: 0; width: 36px; height: 36px; border-left: 4px solid #36D6E7; border-bottom: 4px solid #36D6E7"></div>
<div style="position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; border-right: 4px solid #36D6E7; border-bottom: 4px solid #36D6E7"></div>
<div style="width: 256px; height: 384px; background: #0F2236; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box; font-size: 14px; letter-spacing: 2px">COVER ART</div>
</div>
<div style="position: relative; align-self: stretch; padding: 2px; background: #36D6E7; clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px)">
<div style="background: #0A1626; padding: 12px 16px; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px)">
<div style="font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.15">[Book title]</div>
<div style="font-size: 14px; color: #36D6E7; margin-top: 4px">AUTHOR: [Author name]</div>
<div style="font-size: 16px; line-height: 1.3; margin-top: 6px">&gt; [One line on why it's for you.]</div>
</div>
</div>
<div style="position: relative; align-self: stretch; display: flex; gap: 12px; margin-top: auto">
<button style="flex: 1; padding: 2px; background: #36D6E7; border: 0; clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%)"><span style="display: block; padding: 12px 6px; background: #060B14; color: #D8F6FA; clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 15px 100%, 0 50%); font: 800 14px 'Orbitron', sans-serif; letter-spacing: 2px">MORE DATA</span></button>
<button style="flex: 1; padding: 14px 6px; background: {{accent}}; color: #060B14; border: 0; clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%); font: 800 14px 'Orbitron', sans-serif; letter-spacing: 2px">NEXT PICK</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B2C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF6B2C' };
}
}
</script>
</body>
</html>
